# Monthly, grouped: one pull request per ecosystem. Security updates are separate (repository setting).
# The facilitator's Rust dependencies are not listed: they come from facilitator/x402-rs/build/Cargo.lock,
# x402-rs's lock at the pinned commit with listed additions and security upgrades, and the build refuses
# any other package (facilitator/x402-rs/README.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

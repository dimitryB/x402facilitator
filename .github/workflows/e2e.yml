# Builds the facilitator image (x402-rs at the pinned commit plus the patches and the bip122 crate),
# runs the Rust unit tests on the patched tree, then the end-to-end suite against the image on local
# anvil forks of both Hemi chains. The forks read from the public Hemi RPCs; every write stays local,
# and the only keys are anvil's published dev keys.
name: Image and e2e

on:
  push:
    branches: [main]
  # Every pull request, so that the check always reports and can be required on main. The `changes` job
  # skips the expensive one when nothing it tests changed; GitHub counts a job skipped by its `if` as
  # passed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Does this change need the e2e suite?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Changed files, with the old name of a renamed one.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)')
          printf '%s\n' "$files"
          # What the image, the Rust tests and the e2e suite are built from.
          if printf '%s\n' "$files" | grep -qE '^(facilitator/|tests/|scripts/fork\.sh$|shared/|btc/|seller/|buyer/|contracts/(src|script|deploy-data)/|docker-compose[^/]*\.yml$|package-lock\.json$|\.github/workflows/e2e\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  image-e2e:
    name: Image build, Rust tests, e2e on forks
    needs: changes
    # Also when `changes` failed: an error there must not let a pull request skip the suite.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - run: npm ci
      - name: Build the facilitator image
        run: docker compose build
      - name: Rust unit tests on the patched tree
        run: |
          docker build --target builder -t hemi-x402-builder:ci facilitator
          docker run --rm --network none hemi-x402-builder:ci sh -ec '
            cargo test --frozen -p x402-types -p x402-facilitator-local -p x402-chain-eip155 \
              --features x402-chain-eip155/facilitator,x402-chain-eip155/telemetry
            cargo test --frozen -p x402-chain-bip122 -p x402-facilitator \
              --features x402-chain-bip122/facilitator,x402-chain-bip122/telemetry,x402-facilitator/chain-bip122
          '
      - name: End-to-end suite on anvil forks
        run: npm run test:e2e
      - name: Facilitator and fork logs
        if: failure()
        run: |
          docker compose ls || true
          tail -n 200 .scratch/*/*.log 2>/dev/null || true

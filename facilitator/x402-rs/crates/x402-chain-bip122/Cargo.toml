[package]
name = "x402-chain-bip122"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bitcoin L1 (BIP-122) payments for the x402 protocol, verified and recorded through Hemi's hBK"
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
default = []
telemetry = ["dep:tracing", "x402-types/telemetry", "x402-chain-eip155/telemetry"]
facilitator = [
  "dep:async-trait",
  "dep:alloy-provider",
  "dep:alloy-rpc-types-eth",
  "x402-chain-eip155/facilitator",
]
full = ["telemetry", "facilitator"]

[dependencies]
x402-types = { workspace = true }
x402-chain-eip155 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }

# BIP32 public derivation, P2WPKH and BIP86 P2TR scripts, SLIP-132 decoding.
bitcoin = { workspace = true }

# The Hemi side: the X402BtcSettler ABI, eth_call and the shared Hemi provider.
alloy-primitives = { version = "1.6" }
alloy-sol-types = { version = "1.6" }
alloy-provider = { version = "2.0", optional = true }
alloy-rpc-types-eth = { version = "2.0", optional = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
